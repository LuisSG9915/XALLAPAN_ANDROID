buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        playServicesLocationVersion = "21.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

def xallapanCmakeRoot = new File(System.getProperty("user.home"), ".xallapan/cmake")

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        def libraryExtension = subproject.extensions.getByType(com.android.build.api.dsl.LibraryExtension)
        libraryExtension.externalNativeBuild.cmake.buildStagingDirectory = new File(xallapanCmakeRoot, subproject.name)
    }

    tasks.withType(com.facebook.react.tasks.GenerateCodegenSchemaTask).configureEach {
        doNotTrackState("React Native codegen output is not trackable on Windows Server")
    }
    tasks.withType(com.facebook.react.tasks.GenerateCodegenArtifactsTask).configureEach {
        doNotTrackState("React Native codegen output is not trackable on Windows Server")
    }
    tasks.matching { task ->
        task.name.startsWith("buildCMake") || task.name.startsWith("configureCMake")
    }.configureEach {
        doNotTrackState("CMake output tracking is not reliable on Windows")
    }
}
